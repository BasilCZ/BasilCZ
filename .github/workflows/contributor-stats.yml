name: Contributor Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate contributor stats SVG
        uses: HwangTaehyun/github-repository-contribution-stats/action@main
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.CONTRIB_STATS_TOKEN }}
        with:
          username: BasilCZ
          output-file: github-contributor-stats.svg
          combine-all-yearly-contributions: "true"
          limit: "5"
          theme: dark

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add github-contributor-stats.svg
          git diff --staged --quiet || git commit -m "Update contributor stats"
          git push
